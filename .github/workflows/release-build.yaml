name: Release build

# The build, manifest, signature and publish steps of every channel (decision 0130). The wrappers release-stable.yaml,
# release-beta.yaml and release-nightly.yaml decide when a release is allowed and what it is called; this workflow does
# the work and holds nothing channel-specific except the environment (and so the signing key) it runs in.
# publish=false does everything but publish, with a throwaway key when the real one is not configured, so the
# pipeline can be tested.
#
# ci.yaml is canonical for how things are built: it runs far more often than a release, so this workflow follows it
# instead of defining a setup of its own.
#   - The two cargo variables below equal ci.yaml's. Swatinem/rust-cache puts CARGO*/RUST*/CC* variables into its key,
#     so a different value here is a different key and CI's cache is not found.
#   - The cargo cache and the bundled tmux are restored from what CI saved (same keys as the static and tmux jobs of
#     ci.yaml). A release run only reads: it never writes a cache entry, so releases cannot crowd out the 10 GB budget.
#   - A miss is not an error. The build then simply runs cold, as it always did.
# Caches are only visible from the default branch (and the ref itself), so they hit when CI's pushes to the default
# branch wrote them. Look for "Cache hit" in the log of the two restore steps.

on:
  workflow_call:
    inputs:
      channel: { description: 'stable, beta or nightly; also the GitHub Environment that holds the signing key', required: true, type: string }
      kid: { description: 'id of the channel signing key in release-keys.txt (r1, b1, n1)', required: true, type: string }
      version: { description: 'manifest version, full SemVer', required: true, type: string }
      tag: { description: 'release tag the assets are published under', required: true, type: string }
      sha: { description: 'commit to build', required: true, type: string }
      publish: { description: 'create the release and move the aliases', required: true, type: boolean }
      prerelease: { required: true, type: boolean }
      latest: { description: 'GitHub marks it as the latest release (only stable)', required: true, type: boolean }
      aliases: { description: 'space separated rolling releases that may point at it', required: false, type: string, default: '' }
      notes: { description: 'text put before the generated release notes', required: false, type: string, default: '' }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # A dry run may use any version (the default is 0.0.0); the gates of the wrappers hold a published one to the tag.
      - name: The version has the Cargo.toml version as its core
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate="$(grep -m1 '^version' packages/server/Cargo.toml | cut -d'"' -f2)"
          case "$VERSION" in
            "$crate"|"$crate"-*) ;;
            *) echo "version $VERSION does not start from packages/server/Cargo.toml version $crate"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # The same keys as the static job of ci.yaml. Restore only: save-if is false.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-${{ matrix.arch }}
          key: ${{ matrix.target }}
          save-if: false

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          TERMENBOX_BUILD: ${{ inputs.sha }}
          # the binary reports the full SemVer, and so knows its own channel (decision 0130)
          TERMENBOX_RELEASE_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked -p termenbox-server --target ${{ matrix.target }}

      - name: Gate - the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/termenbox-server
          strip "$bin"
          if readelf -l "$bin" | grep -q INTERP; then echo "the binary asks for a dynamic loader"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then echo "the binary needs shared libraries"; exit 1; fi
          mkdir -p dist
          cp "$bin" dist/termenbox-server-${{ matrix.arch }}-linux

      # The tmux build depends on the pinned sources only, not on the version: take the one the tmux job of ci.yaml saved
      # (the same key), and build it here only when it is not there.
      - name: Restore the bundled tmux built by CI
        id: tmux
        uses: actions/cache/restore@v4
        with:
          path: tmux-out
          key: tmux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-tmux.sh') }}

      - name: Build the bundled tmux (pinned sources, static, terminfo compiled in)
        if: steps.tmux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y bison
          .github/scripts/build-tmux.sh tmux-out

      - name: Gate - tmux is static and runs with an empty PATH and no terminfo on the host
        run: |
          .github/scripts/check-tmux.sh tmux-out/tmux
          cp tmux-out/tmux dist/tmux-${{ matrix.arch }}-linux

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/termenbox-server-${{ matrix.arch }}-linux
            dist/tmux-${{ matrix.arch }}-linux
          retention-days: 7

      # The licence texts are the same for both architectures; one copy ships next to the binaries.
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: release-tmux-notices
          path: |
            tmux-out/tmux-COPYING
            tmux-out/tmux-libevent-LICENSE
            tmux-out/tmux-ncurses-COPYING
          retention-days: 7

  manifest:
    name: Manifest, signature and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The signing key is the secret RELEASE_SIGNING_KEY of this environment, so a channel's key is only ever
    # available to a run of that channel (the build jobs above never see it).
    environment: ${{ inputs.channel }}
    permissions:
      contents: write
    # The inputs reach the scripts as variables, never pasted into the script text.
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write the manifest
        run: python3 .github/scripts/make_manifest.py "$VERSION" dist dist/manifest.json --channel "$CHANNEL" --tag "$TAG"

      - name: The manifest lists tmux for both architectures, with its notices
        run: |
          cat dist/manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open("dist/manifest.json"))
          for arch in ("x86_64", "aarch64"):
              assert m["tmux"][arch]["url"].endswith(f"/tmux-{arch}-linux"), arch
              assert len(m["tmux"][arch]["sha256"]) == 64, arch
          assert sorted(m["tmux_notices"]) == ["tmux-COPYING", "tmux-libevent-LICENSE", "tmux-ncurses-COPYING"]
          PY

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          # A dry run never touches the real key, so it also works for a channel whose key is not set up yet.
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ "$PUBLISH" = true ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            cp packages/server/release-keys.txt "$RUNNER_TEMP/release-keys.txt"
          elif [ "$PUBLISH" = true ]; then
            echo "RELEASE_SIGNING_KEY is not set in the $CHANNEL environment: refusing to publish an unsigned release"; exit 1
          else
            echo "::warning::dry run: signing with a throwaway key"
            ssh-keygen -q -t ed25519 -N '' -C throwaway -f "$RUNNER_TEMP/release_key"
            bound=""; [ "$CHANNEL" = stable ] || bound=" channel=$CHANNEL"
            echo "$KID $(cut -d' ' -f1,2 "$RUNNER_TEMP/release_key.pub")$bound" > "$RUNNER_TEMP/release-keys.txt"
          fi
          ssh-keygen -Y sign -n termenbox-release -f "$RUNNER_TEMP/release_key" dist/manifest.json
          rm -f "$RUNNER_TEMP/release_key"
          # the same check the installer makes with plain ssh-keygen
          # only the channel's own key counts: a key of another channel (the stable key in a beta environment) is refused here
          grep -v '^#' "$RUNNER_TEMP/release-keys.txt" | awk -v kid="$KID" '$1 == kid && NF >= 3 { print "termenbox-release " $2 " " $3 }' > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "release-keys.txt has no key $KID: add its public half (owner work, decision 0130)"; exit 1; }
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I termenbox-release -n termenbox-release -s dist/manifest.json.sig < dist/manifest.json
          echo "TERMENBOX_RELEASE_KEYS_FILE=$RUNNER_TEMP/release-keys.txt" >> "$GITHUB_ENV"

      - name: The server binary accepts what was just signed
        run: |
          chmod +x dist/termenbox-server-x86_64-linux
          # this binary was built with the release version, so it follows the channel being released
          TERMENBOX_RELEASE_KEYS="$(cat "$TERMENBOX_RELEASE_KEYS_FILE")" dist/termenbox-server-x86_64-linux \
            --verify-release dist/manifest.json --release-sig dist/manifest.json.sig --release-arch aarch64 | tee "$RUNNER_TEMP/verify.txt"
          grep -qx "kid=$KID" "$RUNNER_TEMP/verify.txt"
          grep -qx "version=$VERSION" "$RUNNER_TEMP/verify.txt"
          # and refuses a changed manifest
          cp dist/manifest.json "$RUNNER_TEMP/changed.json" && echo ' ' >> "$RUNNER_TEMP/changed.json"
          if TERMENBOX_RELEASE_KEYS="$(cat "$TERMENBOX_RELEASE_KEYS_FILE")" dist/termenbox-server-x86_64-linux \
            --verify-release "$RUNNER_TEMP/changed.json" --release-sig dist/manifest.json.sig; then echo "a changed manifest was accepted"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: |
            dist/manifest.json
            dist/manifest.json.sig
          retention-days: 7

      - name: Publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ inputs.latest }}
        run: |
          args=(--target "$SHA" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ "$LATEST" = true ]; then args+=(--latest); else args+=(--latest=false); fi
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); fi
          gh release create "$TAG" --title "$TAG" "${args[@]}" \
            dist/termenbox-server-x86_64-linux dist/termenbox-server-aarch64-linux \
            dist/tmux-x86_64-linux dist/tmux-aarch64-linux dist/tmux-COPYING dist/tmux-libevent-LICENSE dist/tmux-ncurses-COPYING \
            dist/manifest.json dist/manifest.json.sig

      # The rolling releases only ever move forward (a stable release moves channel-beta when it is newer than the
      # last beta); they hold a copy of the manifest and nothing else, the assets stay under the tag above.
      - name: Move the aliases
        if: inputs.publish && inputs.aliases != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ALIASES: ${{ inputs.aliases }}
        run: |
          for alias in $ALIASES; do
            sh .github/scripts/update_alias.sh "$alias" dist/manifest.json dist/manifest.json.sig
          done
