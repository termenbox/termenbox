          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: sh .go-getter/bin/go-getter check --stage ci

  verify-format:
    runs-on: ubuntu-latest
    steps:
