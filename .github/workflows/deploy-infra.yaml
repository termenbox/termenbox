name: Deploy Cloud Infrastructure

# force re-register workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
      environment:
        description: 'Target environment (currently only "cloud")'
        required: true
        type: choice
        options:
          - cloud

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.9'
  TF_WORKING_DIR: infra/termenbox-cloud

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (cloud)
    runs-on: ubuntu-latest
    environment: cloud
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV

      - name: Initialize Terraform (local backend first)
        run: |
          # Check if R2 bucket exists using wrangler or try to init with R2 backend
          # If it fails, create bucket with local backend first
          set +e
          terraform init -input=false \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" 2>&1 | grep -q "NoSuchBucket"
          BUCKET_MISSING=$?
          set -e
          
          if [ $BUCKET_MISSING -eq 0 ]; then
            echo "R2 bucket does not exist, creating with local backend..."
            printf 'terraform {\n  backend "local" {\n    path = "terraform.tfstate"\n  }\n}\n' > backend_override.tf
            terraform init -input=false
            terraform apply -input=false -auto-approve \
              -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
              -target=cloudflare_r2_bucket.terraform_state \
              -var="cloudflare_zone_name=${{ vars.CLOUDFLARE_ZONE_NAME }}" \
              -var="r2_access_key_id=${{ secrets.R2_ACCESS_KEY_ID }}" \
              -var="r2_secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              -var="pages_project_name=${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}"
            rm backend_override.tf
            
            # Now init with R2 backend and migrate state
            terraform init -input=false -migrate-state -force-copy \
              -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
              -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          else
            echo "R2 bucket exists, initializing with R2 backend..."
            terraform init -input=false \
              -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
              -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan -input=false -out=tfplan \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_zone_name=${{ vars.CLOUDFLARE_ZONE_NAME }}" \
            -var="r2_access_key_id=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -var="r2_secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -var="pages_project_name=${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          if [ -f tfplan ]; then
            terraform apply -input=false tfplan
          else
            terraform apply -input=false -auto-approve \
              -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
              -var="cloudflare_zone_name=${{ vars.CLOUDFLARE_ZONE_NAME }}" \
              -var="r2_access_key_id=${{ secrets.R2_ACCESS_KEY_ID }}" \
              -var="r2_secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              -var="pages_project_name=${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Output Client URL
        if: github.event.inputs.action == 'apply'
        run: |
          echo "Client URL: $(terraform output -raw client_url)"