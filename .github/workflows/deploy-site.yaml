name: Deploy landing site

on:
  push:
    branches: [master]
    paths: ['packages/site/**', 'scripts/check-site.mjs', 'README.md', '.github/workflows/deploy-site.yaml']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The page is static; this keeps it from shipping with a missing asset, a title past its length or a command that
      # differs from the README's.
      - name: Check the site
        run: node scripts/check-site.mjs

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy packages/site --project-name=${{ vars.TERMENBOX_SITE_PROJECT_NAME || 'termenbox-site' }} --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
