name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the lockfile and toolchain with prefix fallback, so a dependency bump reuses the previous build's
      # artifacts instead of starting cold; stale entries are pruned on save.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Install tmux (end-to-end tests drive real sessions)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run tests
        run: cargo test --workspace

      - name: Test the release manifest script
        run: python3 .github/scripts/test_make_manifest.py

      - name: Keep the server binary for the browser end-to-end job
        uses: actions/upload-artifact@v4
        with:
          name: termenbox-server
          path: target/release/termenbox-server
          retention-days: 1

  client:
    name: Client (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check the installer script
        run: for f in packages/client/installer/install.sh packages/client/public/uninstall.sh; do sh -n $f && dash -n $f; done

      - name: Check the landing site (metadata, structured data, assets, the install command)
        run: node scripts/check-site.mjs

      - run: pnpm --filter termenbox-client run build

      - run: pnpm --filter termenbox-client run test

      - name: Gate - client bundle size
        run: pnpm --filter termenbox-client run check:bundle

  # Real Chrome against the real server binary: login and claim over WebRTC, typing, reconnect with screen replay,
  # plus the resource gates (server RSS with 10 sessions, CPU while output streams). Only GitHub is a stand-in.
  e2e:
    name: Browser end-to-end and resource gates
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@v4
        with:
          name: termenbox-server
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the browser end-to-end test
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
        run: node e2e/run.mjs

      - name: Touch gestures and session cards in the browser
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
        run: |
          node e2e/touch.mjs
          node e2e/cards.mjs
          node e2e/decision.mjs
          node e2e/activity.mjs
          node e2e/windows.mjs
          node e2e/two-servers.mjs
          node e2e/appshell.mjs
          node e2e/desktop.mjs
          node e2e/app.mjs
          node e2e/pane.mjs
          node e2e/acp.mjs
          node e2e/hookoffer.mjs
          node e2e/add-server.mjs
          node e2e/pair.mjs
          node e2e/failures.mjs
          node e2e/wizard.mjs
          node e2e/search.mjs
  # The native host mode (decision 0075) ships one static musl binary per architecture: no glibc, no OpenSSL,
  # nothing to install. Build both on the native runners and fail if anything is linked dynamically.
  static:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain (aws-lc-rs compiles C code)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-${{ matrix.arch }}
          key: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release -p termenbox-server --target ${{ matrix.target }}

      - name: Gate - the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/termenbox-server
          strip "$bin"
          file "$bin"
          # A static binary has no program interpreter and needs no shared library (ldd words this differently
          # for static and static-pie files, so read the ELF headers instead).
          if readelf -l "$bin" | grep -q INTERP; then echo "the binary asks for a dynamic loader"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then echo "the binary needs shared libraries:"; readelf -d "$bin" | grep NEEDED; exit 1; fi
          ls -l "$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: termenbox-server-musl-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/termenbox-server
          retention-days: 7

  # The same end-to-end test as above against the static binary, so musl-specific problems (DNS, DTLS, PTY, the
  # directory announce) cannot reach a release unnoticed.
  e2e-static:
    name: Browser end-to-end with the static binary
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@v4
        with:
          name: termenbox-server-musl-x86_64
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the browser end-to-end test
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
        run: node e2e/run.mjs

  # The bundled tmux (decision 0119), built from the pinned sources and put through its gate (static, runs with an
  # empty PATH and no terminfo, drives a session in control mode). The installer job installs this very binary.
  tmux:
    name: Bundled tmux (static, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools bison

      - name: Build
        run: .github/scripts/build-tmux.sh tmux-out

      - name: Gate
        run: .github/scripts/check-tmux.sh tmux-out/tmux

      - uses: actions/upload-artifact@v4
        with:
          name: tmux-musl-x86_64
          path: |
            tmux-out/tmux
            tmux-out/tmux-COPYING
            tmux-out/tmux-libevent-LICENSE
            tmux-out/tmux-ncurses-COPYING
          retention-days: 7

  # The native installer (decision 0075) run for real: a machine with systemd, a release signed with a throwaway
  # key, then install, install again, a refused tampered release, and a revert that restores the machine.
  installer:
    name: Native installer (${{ matrix.image }}, ${{ matrix.mode }})
    needs: [static, tmux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['jrei/systemd-debian:12', 'jrei/systemd-ubuntu:24.04']
        mode: [host-user, host-me, host]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: termenbox-server-musl-x86_64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: tmux-musl-x86_64
          path: tmux-dist

      - name: Make signed test releases (0.1.0, a newer one, a broken one, a frozen one), each with the bundled tmux
        run: .github/scripts/make-test-releases.sh release/termenbox-server work tmux-dist

      - name: Start a machine with systemd
        run: |
          docker run -d --name machine --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/work/release:/release" -v "$PWD/work/release2:/release2" \
            -v "$PWD/work/release3:/release3" -v "$PWD/work/release4:/release4" \
            -v "$PWD/packages/client/installer/install.sh:/install.sh:ro" -v "$PWD/packages/client/public/uninstall.sh:/uninstall.sh:ro" \
            -v "$PWD/work/keys.txt:/keys.txt:ro" -v "$PWD/.github/scripts/test-native-install.sh:/test.sh:ro" \
            -v "$PWD/.github/scripts/test-user-install.sh:/test-user.sh:ro" \
            ${{ matrix.image }}
          sleep 8
          docker exec machine sh -c 'apt-get update -qq && apt-get install -y -qq curl openssh-client ca-certificates iproute2 >/dev/null'

      - name: Install, update, roll back, handle requests, refuse tampering, revert
        # host-me needs no root (decision 0113): it is tested as a normal user in a machine of its own, by its own script.
        run: |
          if [ "${{ matrix.mode }}" = host-me ]; then docker exec machine sh /test-user.sh; else docker exec machine sh /test.sh ${{ matrix.mode }}; fi

      - name: Service log (on failure)
        if: failure()
        run: docker exec machine journalctl -u termenbox --no-pager | tail -50
