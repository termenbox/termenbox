name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a PR cancels the stale run. Every push to master/develop gets a group of its own (the commit), so no
# run is cancelled or replaced while pending: each merge gets a full result, a chance to refresh the caches, and can
# be found by the nightly (`workflow_run`) and by a release gate that asks for a green run of a commit.
#
# This file is canonical for the build setup: release-build.yaml follows it (same cargo env, same cache keys, the
# bundled tmux restored from what the tmux job saved) and never writes the caches itself.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caches (Swatinem/rust-cache) are written only by pushes to master/develop (save-if). A PR restores from its base
# branch and never writes, so PR branches cannot evict the 10 GB budget that master/develop caches live in.
#
# Job graph (the critical path is rust-build -> e2e / browsers-real; lint and tests run beside it, not before it):
#   client                                        (typecheck, build, unit tests, bundle gate)
#   rust-lint | rust-build | rust-test            (three cargo jobs in parallel instead of one long chain)
#   browsers                                      (scripted servers, no binary: starts immediately)
#   e2e, browsers-real        needs rust-build    (real server binary)
#   static (x86_64, aarch64) -> e2e-static, installer (+ tmux)
#   ci                                            (single result for branch protection)

jobs:
  client:
    name: Client (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check the installer script
        run: for f in packages/client/installer/install.sh packages/client/public/uninstall.sh; do sh -n $f && dash -n $f; done

      - name: Check the landing site (metadata, structured data, assets, the install command)
        run: node scripts/check-site.mjs

      - name: Typecheck the client (svelte-check)
        run: pnpm --filter termenbox-client run check

      - run: pnpm --filter termenbox-client run build

      - run: pnpm --filter termenbox-client run test

      - name: Gate - client bundle size
        run: pnpm --filter termenbox-client run check:bundle

  rust-lint:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint
          save-if: ${{ github.event_name == 'push' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  # The release server binary the browser jobs drive. Nothing else runs in this job, so e2e and browsers-real start as
  # soon as it is compiled instead of waiting for clippy and the debug test build.
  rust-build:
    name: Rust (release build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release
          save-if: ${{ github.event_name == 'push' }}

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Keep the server binary for the browser end-to-end job
        uses: actions/upload-artifact@v7
        with:
          name: termenbox-server
          path: target/release/termenbox-server
          retention-days: 1

  rust-test:
    name: Rust (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.event_name == 'push' }}

      - name: Install tmux (end-to-end tests drive real sessions)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run tests
        run: cargo test --workspace

      - name: Test the release manifest script
        run: python3 .github/scripts/test_make_manifest.py

      - name: Test the release tag rules, the alias update and the nightly pruning
        run: |
          python3 .github/scripts/test_release_plan.py
          sh .github/scripts/test-prune-nightlies.sh
          sh .github/scripts/test-update-alias.sh

  # Real Chrome against the real server binary: login and claim over WebRTC, typing, reconnect with screen replay,
  # plus the resource gates (server RSS with 10 sessions, CPU while output streams). Only GitHub is a stand-in.
  e2e:
    name: Browser end-to-end and resource gates
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@v8
        with:
          name: termenbox-server
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Browser end-to-end scripts and resource gates (e2e/suite.mjs lists them)
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: node e2e/suite.mjs server

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-chromium-server
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The browser binaries and their OS deps (GStreamer + codec stack for WebKit) are baked into the
  # CI image (docker/Dockerfile.ci, .github/workflows/ci-image.yaml); the matrix jobs start from it
  # so `playwright-core install --with-deps` — which used to stall on azure.archive.ubuntu.com — no
  # longer runs at all. Chromium is the runner's Chrome, so the chromium leg stays on the bare
  # runner and skips the container.
  browsers:
    name: Browser matrix (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, runs: 'desktop:1024x768:1 desktop:1440x900:2' }
          - { engine: firefox, runs: 'desktop:1024x768:1 desktop:1440x900:2' }
          - { engine: webkit, runs: 'desktop:1024x768:1 desktop:1440x900:2 phone:390x844:3' }
    container: ${{ matrix.engine != 'chromium' && 'ghcr.io/termenbox/termenbox-ci:latest' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the scripts (size:ratio list from the matrix)
        shell: bash
        working-directory: packages/client
        env:
          RUN_ENGINE: ${{ matrix.engine }}
          RUN_LIST: ${{ matrix.runs }}
          RUN_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          fail=0
          for run in $RUN_LIST; do
            IFS=: read -r suite size dpr <<< "$run"
            tag="$suite-$RUN_ENGINE-$size-${dpr}x"
            echo "=== $tag ==="
            mkdir -p "$RUN_ARTIFACTS/$tag"
            E2E_ENGINE="$RUN_ENGINE" E2E_VIEWPORT="$size" E2E_DPR="$dpr" E2E_ARTIFACTS="$RUN_ARTIFACTS/$tag" \
              node e2e/suite.mjs "$suite" || { echo "::error::$tag failed"; fail=1; }
          done
          exit $fail

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-${{ matrix.engine }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # R36: the same engines against the real server binary and real tmux (attach, switch, reconnect, keys, selection, mouse
  # reporting, resize, the 720/1024 breakpoints). WebSocket only; WebRTC and the resource gates stay in the Chromium job above.
  # The phone scripts that need the real server: touch.mjs, run.mjs and wizard.mjs stay in the Chromium server job (CDP,
  # resource gates, fake camera). Four legs of two runs each keep the legs about the same length.
  #
  # Firefox and WebKit run in the CI image (docker/Dockerfile.ci) so their browser binaries, OS deps and tmux are already
  # present and no apt step runs in the matrix. Chromium uses the runner's Chrome and the runner's tmux.
  browsers-real:
    name: Browser matrix, real server (${{ matrix.name }})
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium, engine: chromium, runs: 'realserver:1024x768:1 realserver:1440x900:2' }
          - { name: firefox, engine: firefox, runs: 'realserver:1024x768:1 realserver:1440x900:2' }
          - { name: webkit-desktop, engine: webkit, runs: 'realserver:1024x768:1 realserver:1440x900:2' }
          - { name: webkit-phone, engine: webkit, runs: 'realserver:390x844:3 phone-real:390x844:3' }
    container: ${{ matrix.engine != 'chromium' && 'ghcr.io/termenbox/termenbox-ci:latest' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: termenbox-server
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the scripts (suite:size:ratio list from the matrix)
        shell: bash
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
          RUN_ENGINE: ${{ matrix.engine }}
          RUN_LIST: ${{ matrix.runs }}
          RUN_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          fail=0
          for run in $RUN_LIST; do
            IFS=: read -r suite size dpr <<< "$run"
            tag="$suite-$RUN_ENGINE-$size-${dpr}x"
            echo "=== $tag ==="
            mkdir -p "$RUN_ARTIFACTS/$tag"
            E2E_ENGINE="$RUN_ENGINE" E2E_VIEWPORT="$size" E2E_DPR="$dpr" E2E_ARTIFACTS="$RUN_ARTIFACTS/$tag" \
              node e2e/suite.mjs "$suite" || { echo "::error::$tag failed"; fail=1; }
            # The runs used to be separate machines: leave nothing of one run for the next.
            tmux kill-server 2>/dev/null || true
          done
          exit $fail

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-real-${{ matrix.name }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The native host mode (decision 0075) ships one static musl binary per architecture: no glibc, no OpenSSL,
  # nothing to install. Build both on the native runners and fail if anything is linked dynamically.
  static:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain (aws-lc-rs compiles C code)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-${{ matrix.arch }}
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release -p termenbox-server --target ${{ matrix.target }}

      - name: Gate - the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/termenbox-server
          strip "$bin"
          file "$bin"
          # A static binary has no program interpreter and needs no shared library (ldd words this differently
          # for static and static-pie files, so read the ELF headers instead).
          if readelf -l "$bin" | grep -q INTERP; then echo "the binary asks for a dynamic loader"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then echo "the binary needs shared libraries:"; readelf -d "$bin" | grep NEEDED; exit 1; fi
          ls -l "$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: termenbox-server-musl-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/termenbox-server
          retention-days: 7

  # The same end-to-end test as above against the static binary, so musl-specific problems (DNS, DTLS, PTY, the
  # directory announce) cannot reach a release unnoticed.
  e2e-static:
    name: Browser end-to-end with the static binary
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@v8
        with:
          name: termenbox-server-musl-x86_64
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the browser end-to-end test
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
        run: node e2e/run.mjs

  # The bundled tmux (decision 0119), built from the pinned sources and put through its gate (static, runs with an
  # empty PATH and no terminfo, drives a session in control mode). The installer job installs this very binary.
  #
  # The build does not depend on the version or the commit, only on the pinned sources in build-tmux.sh, so it is cached
  # by the hash of that script: a hit skips the toolchain install and the build, and the gate runs either way.
  # Both architectures are built here because the releases ship both and restore exactly these entries (a release run
  # only reads them). Only the x86_64 binary is uploaded as an artifact, as before; the installer job uses that one.
  # The cache is written by pushes only, after the gate has passed. Keep every input of the build inside build-tmux.sh
  # (or add the other files to the hash below), or a change to them will not rebuild.
  tmux:
    name: Bundled tmux (static, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Restore the tmux build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: tmux-out
          key: tmux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-tmux.sh') }}

      - name: Install the musl toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools bison

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-tmux.sh tmux-out

      - name: Gate
        run: .github/scripts/check-tmux.sh tmux-out/tmux

      - name: Save the tmux build
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tmux-out
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: tmux-musl-x86_64
          path: |
            tmux-out/tmux
            tmux-out/tmux-COPYING
            tmux-out/tmux-libevent-LICENSE
            tmux-out/tmux-ncurses-COPYING
          retention-days: 7

  # The native installer (decision 0075) run for real: a machine with systemd, a release signed with a throwaway
  # key, then install, install again, a refused tampered release, and a revert that restores the machine.
  installer:
    name: Native installer (${{ matrix.image }}, ${{ matrix.mode }})
    needs: [static, tmux]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['jrei/systemd-debian:12', 'jrei/systemd-ubuntu:24.04']
        mode: [host-user, host-me, host]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: termenbox-server-musl-x86_64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: tmux-musl-x86_64
          path: tmux-dist

      - name: Make signed test releases (0.1.0, a newer one, a broken one, a frozen one), each with the bundled tmux
        run: .github/scripts/make-test-releases.sh release/termenbox-server work tmux-dist

      - name: Start a machine with systemd
        run: |
          docker run -d --name machine --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/work/release:/release" -v "$PWD/work/release2:/release2" \
            -v "$PWD/work/release3:/release3" -v "$PWD/work/release4:/release4" \
            -v "$PWD/packages/client/installer/install.sh:/install.sh:ro" -v "$PWD/packages/client/public/uninstall.sh:/uninstall.sh:ro" \
            -v "$PWD/work/keys.txt:/keys.txt:ro" -v "$PWD/.github/scripts/test-native-install.sh:/test.sh:ro" \
            -v "$PWD/.github/scripts/test-user-install.sh:/test-user.sh:ro" \
            ${{ matrix.image }}
          sleep 8
          docker exec machine sh -c 'apt-get update -qq && apt-get install -y -qq curl openssh-client ca-certificates iproute2 >/dev/null'

      - name: Install, update, roll back, handle requests, refuse tampering, revert
        # host-me needs no root (decision 0113): it is tested as a normal user in a machine of its own, by its own script.
        run: |
          if [ "${{ matrix.mode }}" = host-me ]; then docker exec machine sh /test-user.sh; else docker exec machine sh /test.sh ${{ matrix.mode }}; fi

      - name: Service log (on failure)
        if: failure()
        run: docker exec machine journalctl -u termenbox --no-pager | tail -50

  # One result for branch protection: require this check instead of the individual jobs, and the graph above can be
  # reshaped without touching the repository settings again.
  ci:
    name: CI result
    if: ${{ always() }}
    needs: [client, rust-lint, rust-build, rust-test, e2e, browsers, browsers-real, static, e2e-static, tmux, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
