name: Build CI Image

# CI image for the browser matrix jobs. The Playwright OS deps and browser binaries change rarely;
# rebuilding weekly picks up OS security fixes and a new Playwright build, and the matrix jobs then
# start FROM it and skip the apt install that used to stall on azure.archive.ubuntu.com.
on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [master, develop]
    paths: ['docker/Dockerfile.ci', '.github/workflows/ci-image.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/termenbox/termenbox-ci

jobs:
  ci:
    name: Build & Push CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}
