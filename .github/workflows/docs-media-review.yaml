name: Docs Media Review

# DECISION-0158: the owner approves a rendered video by ticking its line in the review issue, or sends it back with
# `/regen <case> [pace=slow|normal] [profile=phone|desktop] [caption=off] <note>`. Issue and comment events run THIS file from the default
# branch with the repository token for anyone who can comment (FACT-0067), so the first step checks the actor's permission and every
# later step is skipped unless it is write, maintain or admin. The comment and the issue body reach the scripts only through env.
on:
  issues:
    types: [edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: docs-media-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Approve or send back
    # Only the review issues, never a comment of our own.
    if: contains(github.event.issue.labels.*.name, 'docs-media') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the actor's permission
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in write|maintain|admin) echo "ok=true" >> "$GITHUB_OUTPUT" ;; *) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: $ACTOR has $perm" ;; esac

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: '24'

      - name: Work out what was asked
        id: ask
        if: steps.gate.outputs.ok == 'true'
        env:
          EVENT: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          BODY: ${{ github.event.issue.body }}
          BEFORE: ${{ github.event.changes.body.from }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          run_id=$(printf '%s' "$TITLE" | sed -nE 's/^Docs media review ([0-9]+)$/\1/p')
          [ -n "$run_id" ] || { echo "not a review issue"; echo "action=none" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          # The cases of this review are the ones in its checklist; a command can name only those.
          ledger=$(printf '%s\n' "$BODY" | sed -nE 's/^- \[[ xX]\] ([a-z0-9-]+) (phone|desktop) ([0-9a-f]+)[[:space:]]*$/\1 \2 \3/p')
          catalog=$(printf '%s\n' "$ledger" | awk '{print $1}' | sort -u | tr '\n' ' ')
          if [ "$EVENT" = issues ]; then
            ticked=$(BEFORE="$BEFORE" AFTER="$BODY" node scripts/docs-media-review-cli.mjs ticked)
            printf '%s' "$ticked" | jq -r '.ticked[] | "\(.case) \(.profile) \(.hash)"' > "$RUNNER_TEMP/approve.txt"
            if [ -s "$RUNNER_TEMP/approve.txt" ]; then echo "action=approve" >> "$GITHUB_OUTPUT"; else echo "action=none" >> "$GITHUB_OUTPUT"; fi
          else
            parsed=$(COMMENT="$COMMENT" CATALOG="$catalog" node scripts/docs-media-review-cli.mjs parse)
            cmd=$(printf '%s' "$parsed" | jq -r '.cmd // "none"')
            if [ "$cmd" = approve ]; then
              want=$(printf '%s' "$parsed" | jq -r .case)
              printf '%s\n' "$ledger" | awk -v w="$want" 'w == "all" || $1 == w' > "$RUNNER_TEMP/approve.txt"
              echo "action=approve" >> "$GITHUB_OUTPUT"
            elif [ "$cmd" = regen ]; then
              echo "action=regen" >> "$GITHUB_OUTPUT"
              printf '%s' "$parsed" > "$RUNNER_TEMP/regen.json"
            fi
          fi

      - name: Download the render
        if: steps.ask.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ask.outputs.run_id }}
        run: gh run download "$RUN_ID" --name "docs-media-$RUN_ID" --dir "$RUNNER_TEMP/render"

      - uses: actions/checkout@v7
        if: steps.ask.outputs.action == 'approve'
        with:
          ref: docs-media
          path: docs-media

      - name: Approve
        if: steps.ask.outputs.action == 'approve'
        env:
          APPROVER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export APPROVED_ON=$(date -u +%F)
          while read -r c p h; do
            node scripts/docs-media-review-cli.mjs approve "$RUNNER_TEMP/render" docs-media "$c" "$p" "$h"
          done < "$RUNNER_TEMP/approve.txt"
          node scripts/docs-media-manifest.mjs --check docs-media
          cd docs-media
          git config user.name "docs-media[bot]"
          git config user.email "docs-media-bot@users.noreply.github.com"
          git add -A
          git commit -m "media: approved by $APPROVER" && git push origin HEAD:docs-media
          # The site deploys from master; this publishes what was approved with the current release.
          gh workflow run deploy-site.yaml --ref master

      - name: Send back
        if: steps.ask.outputs.action == 'regen'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          c=$(jq -r .case "$RUNNER_TEMP/regen.json"); pace=$(jq -r .pace "$RUNNER_TEMP/regen.json")
          profile=$(jq -r .profile "$RUNNER_TEMP/regen.json"); caption=$(jq -r .caption "$RUNNER_TEMP/regen.json")
          note=$(jq -r .note "$RUNNER_TEMP/regen.json")
          gh workflow run docs-media.yaml -f case="$c" -f profile="$profile" -f pace="$pace" -f caption="$caption"
          gh label create video-needs-edit --color d93f0b --description "Sent back for a new render" 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label video-needs-edit
          body=$(gh issue view "$ISSUE" --json body --jq .body | sed -E "s/^- \[[xX]\] ($c) (phone|desktop) /- [ ] \1 \2 /")
          gh issue edit "$ISSUE" --body "$body"
          printf 'Re-rendering `%s` (profile %s, pace %s, captions %s). Note kept: %s\n' "$c" "$profile" "$pace" "$caption" "$note" > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
