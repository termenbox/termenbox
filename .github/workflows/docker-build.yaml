name: Build & Push Docker Image

# The image tags follow the channels (decision 0130): a stable tag pushes latest, X.Y and X.Y.Z; a beta tag pushes beta
# and the exact version; a nightly pushes nightly and the exact version. `latest` moves only for a stable tag, never
# for a push to master, and there is no `edge`. release_plan.py decides, so the tags cannot drift from the release.
on:
  push:
    tags: ['v*']
  # Pull requests build the image (amd64) without pushing, so a broken Dockerfile fails before merge.
  pull_request:
    paths: ['docker/**', 'packages/core/**', 'packages/server/**', 'packages/agent/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/docker-build.yaml']
  # release-nightly.yaml calls this for its commit: a tag made with the workflow token starts no workflow of its own.
  workflow_call:
    inputs:
      sha: { description: 'commit to build', required: true, type: string }
      version: { description: 'full SemVer the image reports', required: true, type: string }
      tags: { description: 'space separated image tags to push', required: true, type: string }
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (e.g. staging, latest, v1.0.0)'
        required: true
        type: string
        default: 'latest'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  # Decides whether this run builds and what it pushes.
  plan:
    name: Plan the image tags
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
      tags: ${{ steps.p.outputs.tags }}
      version: ${{ steps.p.outputs.version }}
      sha: ${{ steps.p.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - id: p
        env:
          CALL_TAGS: ${{ inputs.tags }}
          CALL_VERSION: ${{ inputs.version }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          tags=""; version=""; run=true
          if [ -n "$CALL_TAGS" ]; then
            # called by release-nightly.yaml, whose own event name this workflow sees
            tags="$CALL_TAGS"; version="$CALL_VERSION"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            plan="$(python3 .github/scripts/release_plan.py tag "$GITHUB_REF_NAME")"
            if [ "$(jq -r .channel <<<"$plan")" = none ]; then
              echo "::notice::$GITHUB_REF_NAME is not a stable or beta tag; no image"; run=false
            fi
            tags="$(jq -r '.docker_tags | join(" ")' <<<"$plan")"; version="$(jq -r .version <<<"$plan")"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tags="$DISPATCH_TAG"
          fi
          {
            echo "run=$run"; echo "version=$version"; echo "sha=${{ inputs.sha || github.sha }}"
            echo "tags<<EOF"; for t in $tags; do echo "type=raw,value=$t"; done; echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # One native runner per architecture: no QEMU, so the Rust build runs at full speed. Build cache lives in GHCR
  # (the Actions cache has a 10 GB per-repository cap that two architectures' layers were filling).
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            TERMENBOX_BUILD=${{ needs.plan.outputs.sha }}
            TERMENBOX_RELEASE_VERSION=${{ needs.plan.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/{1}-cache:{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.arch) || '' }}
      - name: Gate - compressed image size
        if: env.PUSH == 'true'
        env:
          IMAGE_MAX_MB: 160 # 119 MB when the gate was added; raise on purpose, in a reviewed change
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          raw="$(docker buildx imagetools inspect --raw "$ref@${{ steps.build.outputs.digest }}")"
          # The pushed digest may be an index (image + attestation); follow it to the real image.
          inner="$(jq -r '[.manifests[]? | select(.platform.architecture != "unknown")][0].digest // empty' <<<"$raw")"
          [ -z "$inner" ] || raw="$(docker buildx imagetools inspect --raw "$ref@$inner")"
          bytes="$(jq '[.config.size, (.layers[].size)] | add' <<<"$raw")"
          mb=$((bytes / 1048576))
          echo "compressed image size (${{ matrix.arch }}): ${mb} MB (limit ${IMAGE_MAX_MB} MB)"
          [ "$mb" -le "$IMAGE_MAX_MB" ] || { echo "image too large"; exit 1; }
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins the two single-architecture images into the multi-architecture tags users pull.
  manifest:
    name: Publish manifest
    if: github.event_name != 'pull_request' && needs.plan.outputs.run == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.plan.outputs.tags }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
