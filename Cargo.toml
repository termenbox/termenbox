[workspace]
members = ["packages/core", "packages/server", "packages/agent", "packages/bridge-contract"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/termenbox/termenbox"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-trait = "0.1"
uuid = { version = "1.7", features = ["serde", "v4"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
oauth2 = "5.0"
axum-extra = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.8"

# Smaller and leaner binary: about 25% less idle RSS per server instance (fact 0047). No panic = "abort": a panic must
# stay one task, not the whole server.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
